# Pioneer TV Weston configuration. Installed to /home/pi/.config/weston.ini by
# system/install.sh, which fills in the output mode: 1280x720@60, because
# players cap stream quality to the window size and 1080p in a browser drops
# frames on a Pi 4. A TV without a 720p mode gets Weston's scaling.
[core]
shell=kiosk-shell.so
idle-time=0
require-input=false

[output]
name=HDMI-A-1
mode=@MODE@

[autolaunch]
path=/opt/pioneer-tv/system/start-chromium.sh
# Weston exits when Chromium exits; systemd restarts both for a clean state.
watch=true

[libinput]
enable-tap=true

[keyboard]
keymap_layout=se
