# Pioneer TV: sound goes to the TV over HDMI. Installed to
# ~/.config/wireplumber/wireplumber.conf.d/50-pioneer-tv.conf for the kiosk user.
monitor.alsa.rules = [
  {
    # The 3.5 mm jack: nothing is plugged in, keep it out of the way.
    matches = [ { device.name = "~alsa_card.platform-.*mailbox" } ]
    actions = { update-props = { device.disabled = true } }
  }
  {
    # HDMI0 carries the TV; make it the preferred output.
    matches = [ { alsa.card_name = "vc4-hdmi-0" } ]
    actions = { update-props = { priority.session = 2000, priority.driver = 2000, node.description = "TV (HDMI)" } }
  }
]
