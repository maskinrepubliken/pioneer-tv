# Pioneer TV: keep the journal on the SD card so the boot before a freeze or
# a power cut can be read (journalctl -b -1), and write it out every 15
# seconds rather than every five minutes, so the last moments before a hang
# are on the card. Installed as /etc/systemd/journald.conf.d/pioneer-tv.conf.
[Journal]
Storage=persistent
SyncIntervalSec=15s
SystemMaxUse=200M
