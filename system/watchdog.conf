# Pioneer TV: the hardware watchdog. systemd pets the Pi's watchdog every few
# seconds; if the whole box hangs (in October it froze for minutes with
# neither ping nor SSH), it stops, and the board resets itself after 15
# seconds instead of waiting for someone to pull the plug. 15 s is the most
# the Pi's watchdog allows. Installed as
# /etc/systemd/system.conf.d/pioneer-tv-watchdog.conf.
[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=2min
