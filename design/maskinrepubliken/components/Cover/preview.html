<style>
  html, body { margin: 0; padding: 0; }
  body { background: var(--paper); }
  svg { display: block; width: 100%; height: auto; }
  .ground { fill: var(--paper); }
  .slab-ink { fill: var(--surface-ink); }
  .slab-forest { fill: var(--surface-forest); }
  .slab-rust { fill: var(--surface-rust); }
  .slab-ochre { fill: var(--ochre); }
  .hole { fill: var(--ochre); }
  .hole-on-ochre { fill: var(--on-ochre); }

    fill: var(--ink);
    font-family: var(--font-display);
    font-weight: 900;

    letter-spacing: -0.01em;

<svg viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Maskinrepubliken — ny teknik för det allmänna">
  <!--
    Blocks: surface-ink 472×112, surface-forest 244×112, surface-rust 128×112, ochre 116×112 — band height 112 ≈ a third of 320, square corners (a punched card has none).
    Arrangement: one full-width strip of unequal bands bleeding off top, left and right; the name sits under it on the paper ground — the brand composes in horizontal strips (perforated header, page, perforated footer).
    Pattern: the punch-card perforation itself — ochre discs at half the perf grid (pitch-x 28, rows 56 apart, r 6.9), set in runs of 1–4 with gaps of 1–3, never evenly spread; no sprocket circles, because a card never stands beside the wordmark.
    Scales: band 112 = 4 × space-6; name inset 46 = space-8; name baseline 236, tagline 268 = space-5 apart; radii: none, the perforated surface is the square half of the system.
  -->
