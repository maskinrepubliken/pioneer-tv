# Pioneer TV daemon configuration. Installed to /etc/pioneer-tv/config.toml.
# Anything left out falls back to the defaults in pioneertv/config.py.

[daemon]
host = "127.0.0.1"
port = 8765
log_level = "info"

[cec]
enabled = true
device = "/dev/cec0"
osd_name = "Pioneer TV"
tv_address = 0
tv_on_gamepad_connect = true   # PS/Xbox button wakes the TV and switches input
wake_on_input = true           # any pad button while the TV is off turns it on (and does nothing else)
home_on_standby = true         # the TV going to standby sends the box back to the launcher
monitor = true                 # follow TV standby and TV remote keys

[images]                      # RomM's covers and Jellyfin's pictures kept on the disk
dir         = "/var/lib/pioneer-tv/images"
cache_mb    = 10240           # the ones unused longest go past this; 0: keep none
max_px      = 600             # made this small (its longer side), as WebP
prefetch_at = "03:30"         # every cover fetched each night; "" for never

[bluetooth]
# Dial paired, trusted pads that are not connected: every 20 s for the first
# minutes after boot (a pad that was on during the reboot is still trying
# then), afterwards only once per interval as a safety net. Pads dial in by
# themselves when switched on; a host that pages often gets in their way.
auto_connect = true
reconnect_interval = 300     # seconds

[gamepad]
stick_deadzone = 0.45
trigger_threshold = 0.5
long_press_ms = 800
repeat_ms = 220

# Button → action. Actions: {key=, modifiers=[]}, {mouse_button=}, {cec=}, {system=}.
# cec: volume_up, volume_down, mute, tv_on, tv_off, tv_toggle, active_source
# system: home, menu, keyboard, escape, reload, back
# invert_axes = ["ABS_Y", "ABS_RY"]   # Nintendo pads are inverted automatically

[gamepad.buttons]
BTN_DPAD_UP    = { key = "KEY_UP" }      # pads whose d-pad is buttons, not a hat
BTN_DPAD_DOWN  = { key = "KEY_DOWN" }
BTN_DPAD_LEFT  = { key = "KEY_LEFT" }
BTN_DPAD_RIGHT = { key = "KEY_RIGHT" }
BTN_SOUTH  = { key = "KEY_ENTER" }
BTN_EAST   = { key = "KEY_ESC", long = { system = "back" } }       # hold B: one page back
BTN_WEST   = { key = "KEY_SPACE", long = { key = "KEY_Z", modifiers = ["KEY_LEFTCTRL"] } }  # hold X: undo
BTN_NORTH  = { system = "keyboard" }                              # Y: the on-screen keyboard
BTN_TL     = { cec = "volume_down", repeat = true }               # L1: TV volume (L1+R1: mute)
BTN_TR     = { cec = "volume_up",   repeat = true }               # R1
BTN_TL2    = { seek = -1 }                                         # L2: seek on the media panel
BTN_TR2    = { seek = 1 }                                          # R2
BTN_MODE   = { system = "menu", long = { system = "home" } }      # the only way to the menus; hold: the start page
BTN_THUMBL = { mouse_button = "BTN_RIGHT" }
BTN_THUMBR = { mouse_button = "BTN_LEFT" }

[gamepad.axes]
ABS_HAT0X = { negative = { key = "KEY_LEFT" }, positive = { key = "KEY_RIGHT" } }
ABS_HAT0Y = { negative = { key = "KEY_UP" },   positive = { key = "KEY_DOWN" } }
ABS_X     = { negative = { key = "KEY_LEFT" }, positive = { key = "KEY_RIGHT" } }
ABS_Y     = { negative = { key = "KEY_UP" },   positive = { key = "KEY_DOWN" } }
ABS_RX    = { mouse = "x" }
ABS_RY    = { mouse = "y" }
ABS_Z     = { seek = -1 }                                         # L2 as a trigger: as fast as pressed
ABS_RZ    = { seek = 1 }                                          # R2

[mouse]
mode = "virtual"     # the extension draws and drives the pointer; "uinput" is a real mouse device (see README)
deadzone = 0.15
max_speed = 1100.0   # pixels per second at full deflection
curve = 2.0
hz = 60              # pointer steps per second; the extension applies them per frame

# Services shown by the launcher, in order (the first has the focus when the
# home page opens). {query} is replaced by the search text.
[[services]]
id = "svtplay"
name = "Play"
tagline = "Public service"
url = "https://www.svtplay.se/"
search_url = "https://www.svtplay.se/sok?q={query}"
color = "#1f7a4d"
glyph = "S"

[[services]]
id = "cineasterna"
name = "Cineasterna"
tagline = "Film från biblioteket"
url = "https://www.cineasterna.com/sv/library/5/discover"
search_url = "https://www.cineasterna.com/sv/library/5/search?q={query}&page=1"
color = "#b8940c"
glyph = "C"

[[services]]
id = "jellyfin"
name = "Film & serier"
tagline = "Jellyfin"
# Our own Film & serier page on top of Jellyfin (extension/launcher/browse.html?library=film),
# opened from the daemon like Musik; videos play in mpv. Jellyfin's own web UI
# (http://<server>:8096/web/) works here too.
url = "http://127.0.0.1:8765/ext/launcher/browse.html?library=film&tv=1"
search_url = "http://127.0.0.1:8765/ext/launcher/browse.html?library=film&tv=1#/search/{query}"
color = "#7b5ea7"
glyph = "J"

# Music: our own Musik pages on top of Jellyfin (extension/launcher/browse.html?library=musik),
# opened from the daemon so that /jellyfin/ is on the same origin. Set the
# server and an API key under [jellyfin] below or on the settings page.
[[services]]
id = "musik"
name = "Musik"
tagline = "Jellyfin"
url = "http://127.0.0.1:8765/ext/launcher/browse.html?library=musik&tv=1"
search_url = "http://127.0.0.1:8765/ext/launcher/browse.html?library=musik&tv=1#/search/{query}"
color = "#a8533a"
glyph = "M"

# Games: our own Spel pages on top of RomM (extension/launcher/browse.html?library=spel).
# They are opened from the daemon so that /romm/ is on the same origin; set
# RomM's address and a client API token under [romm] below or on the settings
# page. The old way, RomM's own web UI with mode = "game", still works too.
[[services]]
id = "spel"
name = "Spel"
tagline = "RomM"
url = "http://127.0.0.1:8765/ext/launcher/browse.html?library=spel&tv=1"
search_url = "http://127.0.0.1:8765/ext/launcher/browse.html?library=spel&tv=1#/search/{query}"
color = "#3b6ea5"
glyph = "S"

# Games are played on the box in RetroArch (GUIDE.md, Games); the cores are
# installed and built by pioneer-tv-cores.service.

[romm]
# Base URL of RomM and a client API token (RomM: Settings → Client API Tokens)
# with read scopes plus roms.user.write and assets.write.
url = "https://spel.lyresten.se"
api_key = ""

[jellyfin]
# Base URL of Jellyfin (without /web/), an API key (Jellyfin: Dashboard → API
# Keys) and the user whose playlists the Musik pages show (empty: the first
# administrator).
url = "http://100.123.142.8:8096"
api_key = ""
user = ""

# Photos: Immich, a big tile in the second row.
[[services]]
id = "immich"
name = "Bilder"
tagline = "Immich"
url = "https://bilder.lyresten.se/"
color = "#3f7fa6"
row = "second"

# The second row of big tiles: row = "second" (Bilder, above). row = "live"
# makes a service a live channel: a small tile in a column of its own at the
# left of the big ones. The SVT channels open straight into the stream and
# take the whole TV (fullscreen = "1").

[[services]]
id = "svt1"
name = "SVT1"
url = "https://www.svtplay.se/kanaler/svt1?start=auto"
row = "live"
kind = "tv"
fullscreen = "1"

[[services]]
id = "svt2"
name = "SVT2"
url = "https://www.svtplay.se/kanaler/svt2?start=auto"
row = "live"
kind = "tv"
fullscreen = "1"

[[services]]
id = "svtbarn"
name = "SVT Barn"
url = "https://www.svtplay.se/kanaler/svtbarn?start=auto"
row = "live"
kind = "tv"
fullscreen = "1"

[[services]]
id = "kunskapskanalen"
name = "Kunskaps\u00adkanalen"
url = "https://www.svtplay.se/kanaler/kunskapskanalen?start=auto"
row = "live"
kind = "tv"
fullscreen = "1"

# Pads by the serial number of their USB device: each 2.4 GHz dongle has its
# own, so two identical pads can be told apart (lsusb -v, or
# /sys/bus/usb/devices/*/serial). A name for the menu and the notices, and
# the colours the pointer (fill), the focus ring (accent) and everything
# ochre (highlight) take while it is in use.
# Also settable through PUT /api/settings {"pads": {...}}.
# [pads."8F12522651"]
# name = "Rosa handkontroll"
# pointer = "#EFDFD4"
# accent = "#E09F96"
# highlight = "#E09F96"
# (the green one: pointer = "#D5E2D6", accent = "#93AE99", highlight = "#93AE99";
# text on a dark highlight turns light by itself)
