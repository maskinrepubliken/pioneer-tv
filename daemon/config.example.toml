# Pioneer TV daemon configuration. Installed to /etc/pioneer-tv/config.toml.
# Anything left out falls back to the defaults in pioneertv/config.py.

[daemon]
host = "127.0.0.1"
port = 8765
log_level = "info"

[cec]
enabled = true
device = "/dev/cec0"
osd_name = "Pioneer TV"
tv_address = 0
tv_on_gamepad_connect = true   # PS/Xbox button wakes the TV and switches input
wake_on_input = true           # any pad button while the TV is off turns it on (and does nothing else)
home_on_standby = true         # the TV going to standby sends the box back to the launcher
monitor = true                 # follow TV standby and TV remote keys

[bluetooth]
# Dial paired, trusted pads that are not connected: every 20 s for the first
# minutes after boot (a pad that was on during the reboot is still trying
# then), afterwards only once per interval as a safety net. Pads dial in by
# themselves when switched on; a host that pages often gets in their way.
auto_connect = true
reconnect_interval = 300     # seconds

[gamepad]
stick_deadzone = 0.45
trigger_threshold = 0.5
long_press_ms = 800
repeat_ms = 220

# Button → action. Actions: {key=, modifiers=[]}, {mouse_button=}, {cec=}, {system=}.
# cec: volume_up, volume_down, mute, tv_on, tv_off, tv_toggle, active_source
# system: home, menu, keyboard, status, escape, reload, back
# invert_axes = ["ABS_Y", "ABS_RY"]   # Nintendo pads are inverted automatically

[gamepad.buttons]
BTN_DPAD_UP    = { key = "KEY_UP" }      # pads whose d-pad is buttons, not a hat
BTN_DPAD_DOWN  = { key = "KEY_DOWN" }
BTN_DPAD_LEFT  = { key = "KEY_LEFT" }
BTN_DPAD_RIGHT = { key = "KEY_RIGHT" }
BTN_SOUTH  = { key = "KEY_ENTER" }
BTN_EAST   = { key = "KEY_ESC", long = { system = "back" } }       # hold B: one page back
BTN_WEST   = { key = "KEY_SPACE" }
BTN_NORTH  = { system = "keyboard", long = { system = "menu" } }  # hold Y: quick menu
BTN_TL     = { key = "KEY_TAB", modifiers = ["KEY_LEFTSHIFT"] }   # previous focusable
BTN_TR     = { key = "KEY_TAB" }                                   # next focusable
BTN_TL2    = { cec = "volume_down", repeat = true }
BTN_TR2    = { cec = "volume_up",   repeat = true }
BTN_SELECT = { system = "status", long = { cec = "tv_toggle" } }
BTN_START  = { system = "menu" }
BTN_MODE   = { system = "home" }
BTN_THUMBL = { mouse_button = "BTN_RIGHT" }
BTN_THUMBR = { mouse_button = "BTN_LEFT" }

[gamepad.axes]
ABS_HAT0X = { negative = { key = "KEY_LEFT" }, positive = { key = "KEY_RIGHT" } }
ABS_HAT0Y = { negative = { key = "KEY_UP" },   positive = { key = "KEY_DOWN" } }
ABS_X     = { negative = { key = "KEY_LEFT" }, positive = { key = "KEY_RIGHT" } }
ABS_Y     = { negative = { key = "KEY_UP" },   positive = { key = "KEY_DOWN" } }
ABS_RX    = { mouse = "x" }
ABS_RY    = { mouse = "y" }
ABS_Z     = { positive = { cec = "volume_down", repeat = true } }
ABS_RZ    = { positive = { cec = "volume_up",   repeat = true } }

[mouse]
mode = "virtual"     # the extension draws and drives the pointer; "uinput" is a real mouse device (see README)
deadzone = 0.15
max_speed = 1100.0   # pixels per second at full deflection
curve = 2.0
hz = 60              # pointer steps per second; the extension applies them per frame

# Services shown by the launcher. {query} is replaced by the search text.
[[services]]
id = "cineasterna"
name = "Cineasterna"
tagline = "Film från biblioteket"
url = "https://www.cineasterna.com/sv/library/5/discover"
search_url = "https://www.cineasterna.com/sv/library/5/search?q={query}&page=1"
color = "#b8940c"
glyph = "C"

[[services]]
id = "svtplay"
name = "SVT Play"
tagline = "Public service"
url = "https://www.svtplay.se/"
search_url = "https://www.svtplay.se/sok?q={query}"
color = "#1f7a4d"
glyph = "S"

# The live channel, opened straight into the stream and taken fullscreen.
[[services]]
id = "svt1"
name = "SVT1"
tagline = "Direktsänt"
url = "https://www.svtplay.se/kanaler/svt1?start=auto"
color = "#b5442a"
glyph = "1"
fullscreen = true

[[services]]
id = "jellyfin"
name = "Jellyfin"
tagline = "Egna filmer och serier"
# The server's Tailscale address; the status views report whether that peer is online.
url = "http://100.123.142.8:8096/web/"
search_url = "http://100.123.142.8:8096/web/#/search.html?query={query}"
color = "#7b5ea7"
glyph = "J"

# Example of a browser emulator (RomM with EmulatorJS). mode = "game" hands the
# pad straight to the page: no arrows, Enter or Escape are synthesised, so the
# game's own Gamepad API input is the only input. Guide goes home, holding Y
# opens the quick menu, the triggers still do TV volume.
# [[services]]
# id = "romm"
# name = "Spel"
# tagline = "RomM"
# url = "http://100.123.142.8:8081/"
# search_url = "http://100.123.142.8:8081/search?search={query}"
# color = "#3b6ea5"
# glyph = "R"
# mode = "game"

[[services]]
id = "romm"
name = "Spel"
tagline = "RomM"
# RomM's web player runs in the browser (EmulatorJS); change the address to your instance.
url = "http://100.123.142.8:8081/"
search_url = "http://100.123.142.8:8081/search?search={query}"
color = "#3b6ea5"
glyph = "R"
