<!doctype html>
<html lang="sv" class="pioneertv-own">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pioneer TV – Inställningar</title>
  <link rel="icon" href="data:,">
  <script>
    // Shared assets live in the extension: served at /ext by the daemon, or
    // reached relatively when this file is opened straight from the repo.
    (function () {
      var base = location.protocol === 'file:' ? '../../../extension/' : '/ext/';
      ['fonts/fonts.css', 'content/tokens.css', 'content/paper.css'].forEach(function (p) {
        var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = base + p; document.head.appendChild(l);
      });
      var s = document.createElement('script'); s.src = base + 'content/icons.js'; document.head.appendChild(s);
      window.PIONEERTV_BASE = base;
    })();
  </script>
  <link rel="stylesheet" href="/static/settings.css">
</head>
<body>
  <!-- The column at the left, as on the browse pages: at rest a ring with
       each tab's icon, with the focus or the pointer in it wider, with the
       names. Up and down shows each tab as its ring gets the focus; right
       goes into the view. Drawn by settings.js (TABS). -->
  <aside class="rail" id="rail">
    <div class="rail-brand">Inställningar</div>
    <nav class="rail-list" id="nav"></nav>
  </aside>
  <div class="app">
    <main class="main" id="main">
      <p class="muted">Laddar…</p>
    </main>
    <footer class="foot" id="foot"></footer>
  </div>
  <script src="/static/settings.js"></script>
</body>
</html>
