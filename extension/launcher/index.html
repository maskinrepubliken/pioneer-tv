<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pioneer TV</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="../content/tokens.css">
  <link rel="stylesheet" href="../content/cursor.css">
  <link rel="stylesheet" href="../content/paper.css">
  <link rel="stylesheet" href="../content/content.css">
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="masthead-right">
        <span class="pill" id="pill-wifi" title="Nätverk"></span>
        <span class="pill" id="pill-tailscale" title="Tailscale"></span>
        <span class="pill" id="pill-gamepad" title="Handkontroll"></span>
        <span class="pill" id="pill-daemon" title="Daemon"></span>
      </div>
    </header>

    <main class="content">
      <section class="tiles" id="tiles" aria-label="Tjänster"></section>
      <section class="tiles tiles-live" id="live" aria-label="Direkt: tv och radio"></section>

      <section class="row">
        <form class="search pioneertv-card" id="search-form" role="search">
          <span class="search-icon" id="search-icon"></span>
          <input id="search" type="search" placeholder="Sök film, serie eller spel…" autocomplete="off" data-pioneertv-initial>
        </form>
      </section>

      <section class="search-targets" id="search-targets" hidden>
        <p class="targets-title">Sök efter <em id="targets-query"></em> på</p>
        <div class="targets" id="targets"></div>
      </section>
    </main>

    <footer class="legend">
      <span><i data-icon="arrowLeft"></i><i data-icon="arrowRight"></i><i data-icon="arrowUp"></i><i data-icon="arrowDown"></i> navigera</span>
      <span><kbd class="pioneertv-kbd">A</kbd> välj</span>
      <span><kbd class="pioneertv-kbd">B</kbd> stäng · håll: tillbaka</span>
      <span><kbd class="pioneertv-kbd">Y</kbd> tangentbord · håll: meny</span>
      <span><kbd class="pioneertv-kbd">GUIDE</kbd> hem</span>
      <span class="credit"><img src="ordbild-en-rad-black.svg" alt="Maskinrepubliken"></span>
    </footer>
  </div>

  <script src="default-services.js"></script>
  <script src="art.js"></script>
  <script src="../content/icons.js"></script>
  <script src="../content/bridge.js"></script>
  <script src="../content/spatial-nav.js"></script>
  <script src="../content/keyboard.js"></script>
  <script src="../content/hud.js"></script>
  <script src="../content/logs.js"></script>
  <script src="../content/cursor.js"></script>
  <script src="../content/video.js"></script>
  <script src="../content/bigscreen.js"></script>
  <script src="../content/game.js"></script>
  <script src="../content/main.js"></script>
  <script src="launcher.js"></script>
</body>
</html>
